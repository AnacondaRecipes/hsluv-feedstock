{% set name = "hsluv" %}
{% set version = "5.0.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fe9891df52ff78ddc9fc9cdba0fd0de49a4378d41e30a3901a1d716ec0c14163

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<311]

requirements:
  host:
    - python
    - pip
    - setuptools >=77.0.3
  run:
    - python
    # for long_description_content_type
    - setuptools >=38.6.0

test:
  source_files:
    - tests
  imports:
    - hsluv
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests

about:
  home: https://github.com/hsluv/hsluv-python
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: A Python implementation of HSLuv (revision 4).
  description: |
    HSLuv is a human-friendly alternative to HSL implemented
    in Python (revision 4).
  doc_url: https://github.com/hsluv/hsluv-python
  dev_url: https://github.com/hsluv/hsluv-python

extra:
  recipe-maintainers:
    - hmaarrfk
